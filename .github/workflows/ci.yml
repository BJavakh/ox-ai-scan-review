name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned runner image: ubuntu-latest moves to a new release on GitHub's schedule.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs, not mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Dependency install scripts stay off, as the report recommends to its users (esbuild and
      # fsevents ship them and work without). Our own postinstall only builds the shared package.
      - name: Install (lockfile only, no install scripts)
        run: |
          npm ci --ignore-scripts
          npm run build:shared

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end smoke test (offline mock mode)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: No unsafe HTML rendering
        run: |
          if grep -rn "dangerouslySetInnerHTML" apps/web/src --include=*.tsx | grep -v "^\s*//"; then
            echo "dangerouslySetInnerHTML is not allowed (docs/SECURITY.md section 6)"; exit 1
          fi

  # The production image: builds, starts as a non-root user, serves the web app and the API on
  # one origin with the right CSPs, reports healthy, and exits cleanly on SIGTERM.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t scan-review:ci .

      # Trivy from its own image, pinned by digest (no third-party action). Fails on fixable
      # high or critical vulnerabilities in the OS packages or Node dependencies of the image.
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            scan-review:ci

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8787:8787 --read-only --cap-drop ALL scan-review:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
          test "$(docker exec app id -u)" != 0
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"mode":"mock"'
          curl -fsSI http://127.0.0.1:8787/ | grep -qi "content-security-policy: default-src 'self'"
          curl -fsSI http://127.0.0.1:8787/api/health | grep -qi "content-security-policy: default-src 'none'"

      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop -t 15 app
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = 0
